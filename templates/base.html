<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}계획{% endblock %} · 플랜두씨 다이어리</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>
  <header><div class="header-inner"><a class="brand" href="{{ url_for('index') }}"><span class="logo" aria-hidden="true">P</span><span>플랜두씨 다이어리<span class="tagline">계획을 쓰고, 하루를 돌아보다</span></span></a><span class="header-note">나의 계획 노트</span></div></header>
  <div class="layout">
    <nav aria-label="주 메뉴"><a {% if not task_menu and not execution_menu and not review_menu %}class="active" aria-current="page"{% endif %} href="{{ url_for('index') }}">계획</a><a {% if task_menu %}class="active" aria-current="page"{% endif %} href="{{ url_for('task_list') }}">할 일</a><a {% if execution_menu %}class="active" aria-current="page"{% endif %} href="{{ url_for('execution_list') }}">실행 기록</a><a {% if review_menu %}class="active" aria-current="page"{% endif %} href="{{ url_for('review_page') }}">돌아보기</a></nav>
    <main id="main">
      <aside class="notice" aria-label="공개 안내"><strong>공개 안내</strong><p>지금은 로그인이 없어 링크를 아는 사람은 누구나 볼 수 있습니다.<br>남이 봐도 괜찮은 내용만 넣으세요.</p></aside>
      {% block body %}{% endblock %}
      <footer><p>플랜두씨 다이어리 · 표시 시각 기준: Asia/Seoul (한국 시간)</p><div class="form-actions"><a class="button secondary" href="{{ url_for('export_all') }}">전체 자료 내보내기</a></div></footer>
    </main>
  </div>
</body>
</html>
